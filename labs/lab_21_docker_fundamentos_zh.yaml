apiVersion: v1
kind: ConfigMap
metadata:
  name: docker-fundamentos-zh-lab
  namespace: girus
  labels:
    app: girus-lab-template
data:
  lab.yaml: |
    name: docker-fundamentos-zh
    title: "Docker 入门（中文版）"
    description: "学习 Docker 容器化的核心概念，从基础命令到容器的运行与管理。本引导式实验讲解 Docker 的架构和核心组件，为你的容器化之旅打下坚实基础。"
    duration: 25m
    image: "girus-devops-zh:0.1"
    privileged: true
    tasks:
      - name: "探索 Docker 环境"
        description: "理解 Docker 的架构与核心组件，学会检查环境、识别版本和平台的基础组成部分。"
        steps:
          - "Docker 是一个容器化平台，可以把应用及其依赖打包成称为容器（container）的标准化单元。与虚拟机不同，容器共享宿主机的内核，因此更轻量、更高效。"
          - "Docker 的架构是客户端-服务器模型：Docker CLI（命令行界面）与 Docker daemon（引擎）通信，后者负责构建、运行和管理容器。"
          - "我们先来查看系统中安装的 Docker 版本："
          - "`docker --version`"
          - "该命令显示 Docker Client 和 Docker Engine 的版本。可以用它确认 Docker 已正确安装，并记录版本号，便于兼容性检查和文档编写。"
          - "要获得更详细的安装信息，包括系统配置、容器数量、镜像数量等数据，执行："
          - "`docker info`"
          - "观察输出中的各个部分，包括："
          - "• Storage Driver - 负责管理镜像和容器的分层"
          - "• Logging Driver - 容器日志的采集方式"
          - "• Cgroup Driver - 所使用的资源管理系统"
          - "• 容器和镜像的数量"
          - "• 网络配置"
          - "镜像和容器是 Docker 的两个基本概念："
          - "• 镜像（image）是只读模板，包含创建容器的指令"
          - "• 容器（container）是镜像的可运行实例"
          - "我们来列出本地已有的镜像："
          - "`docker images`"
          - "如果这是全新安装，可能没有多少镜像。镜像由仓库名和标签（tag，通常表示版本）标识。镜像 ID 是唯一标识符。"
          - "接下来看看是否存在正在运行或已停止的容器："
          - "`docker ps -a`"
          - "`docker ps` 单独使用只显示正在运行的容器。`-a`（all）参数显示全部，包括已停止的。输出包括："
          - "• CONTAINER ID - 容器的唯一标识"
          - "• IMAGE - 创建容器所用的镜像"
          - "• COMMAND - 容器内执行的命令"
          - "• STATUS - 当前状态（Up、Exited 等）"
          - "• PORTS - 宿主机与容器之间的端口映射"
          - "• NAMES - 容器名（未指定时自动生成）"
          - "Docker 使用虚拟网络来实现容器之间以及容器与外界的通信。我们来看看可用的网络："
          - "`docker network ls`"
          - "默认情况下，你至少会看到三个网络："
          - "• bridge - 容器的默认网络"
          - "• host - 移除容器与宿主机之间的网络隔离"
          - "• none - 为容器禁用网络"
        tips:
          - type: "info"
            title: "Docker CLI - 你的主要工具"
            content: "docker 命令是与 Docker 交互的命令行工具。对某个命令有疑问时，使用 docker --help 或 docker [命令] --help。"
          - type: "tip"
            title: "输出格式"
            content: "可以用 --format 改变任何 docker 命令的输出格式。例如：docker ps --format '{{.Names}} {{.Status}}'"
          - type: "warning"
            title: "生产环境安装"
            content: "在生产环境中，安全、存储和网络等方面需要额外配置。Docker Desktop（Windows/Mac）自带友好的默认配置，而 Linux 服务器上的安装通常需要额外调整。"
        validation:
          - command: "docker info &>/dev/null && echo 'success' || echo 'error'"
            expectedOutput: "success"
            errorMessage: "无法访问 Docker 守护进程。请检查服务是否正在运行。"
      
      - name: "运行容器"
        description: "理解容器如何运行、如何与容器交互，以及 Docker 提供的各种运行模式。"
        steps:
          - "运行容器是 Docker 的核心功能。我们来探索创建和管理容器的不同方式。"
          - "1. 用 Hello World 测试环境"
          - "'hello-world' 容器常用来验证 Docker 是否正常工作。我们来运行它："
          - "`docker run hello-world`"
          - "执行这条命令时，Docker 会："
          - "1. 在本地查找 'hello-world' 镜像"
          - "2. 找不到时，自动从 Docker Hub（默认 registry）下载"
          - "3. 基于该镜像创建一个容器"
          - "4. 执行镜像中定义的默认命令"
          - "5. 显示输出并终止容器"
          - "hello-world 的输出会解释幕后发生的每一步，帮助你理解 Docker 的基本流程。"
          - "2. 运行一个 Web 服务器（Nginx）"
          - "接下来运行更实用的东西：一个 Nginx Web 服务器。与 hello-world 不同，我们希望这个容器在后台持续运行："
          - "`docker run -d --name meu-nginx -p 8080:80 nginx`"
          - "我们逐个部分理解这条命令："
          - "• `docker run` - 创建并启动容器的命令"
          - "• `-d`（detached）- 在后台运行容器"
          - "• `--name meu-nginx` - 为容器指定名称（而不是随机名称）"
          - "• `-p 8080:80` - 把容器的 80 端口映射到宿主机的 8080 端口"
          - "• `nginx` - 要使用的镜像名称"
          - "验证容器是否在运行："
          - "`docker ps`"
          - "你应该能在列表中看到 'meu-nginx'，状态为 'Up'。"
          - "3. 访问 Web 服务器"
          - "由于我们把宿主机的 8080 端口映射到了容器的 80 端口，可以访问 Nginx："
          - "`curl localhost:8080`"
          - "你应该能看到 Nginx 默认页面的 HTML。在桌面环境中，也可以打开浏览器访问 http://localhost:8080。"
          - "4. 查看容器日志"
          - "学会查看容器日志对诊断问题非常重要："
          - "`docker logs meu-nginx`"
          - "如果你访问过 Nginx，应该在最近的几行中看到 HTTP 请求日志。"
          - "要实时跟踪日志（类似 'tail -f'）："
          - "`docker logs -f meu-nginx`"
          - "按 Ctrl+C 停止跟踪日志。"
          - "5. 管理容器的生命周期"
          - "容器可以被停止、启动和重启，而不丢失其状态："
          - "`docker stop meu-nginx`"
          - "这会向容器的主进程发送 SIGTERM 信号，等待一段时间后再发送 SIGKILL。"
          - "启动一个已停止的容器："
          - "`docker start meu-nginx`"
          - "重启（等价于先 stop 再 start）："
          - "`docker restart meu-nginx`"
          - "**6. 交互模式与一次性容器**"
          - "做诊断或测试时，我们经常需要启动一个带 shell 的临时容器："
          - "`docker run -it --rm ubuntu bash`"
          - "**参数解释：**"
          - "**-it** - 组合了 **-i**（交互）和 **-t**（分配伪终端），允许与终端交互"
          - "**--rm** - 容器退出后自动删除"
          - "**ubuntu** - 要使用的镜像（这里是 Ubuntu Linux）"
          - "**bash** - 在容器内执行的命令（覆盖镜像中定义的 CMD）"
          - "进入 Ubuntu 容器后，你就处于一个隔离的 Linux 环境中。执行几条命令来探索一下："
          - "`ls -la`"
          - "这是容器内的目录结构，不是你宿主机的。"
          - "`cat /etc/os-release`"
          - "显示容器内 Linux 发行版的详细信息。"
          - "输入以下命令退出容器："
          - "`exit`"
          - "由于使用了 `--rm`，退出后容器会被自动删除。"
          - "7. 检查容器"
          - "查看某个容器的详细信息："
          - "`docker inspect meu-nginx`"
          - "该命令返回详细的 JSON，包含容器的全部配置和状态，包括网络、卷、环境变量等。"
          - "最后，如果要删除一个容器："
          - "`docker rm -f meu-nginx`"
          - "`-f` 参数会强制删除，即使容器仍在运行。"
        tips:
          - type: "warning"
            title: "暴露端口"
            content: "记住：要从宿主机访问容器内的服务，需要用 -p 参数映射端口。例如：-p [宿主机端口]:[容器端口]"
          - type: "info"
            title: "运行模式"
            content: "Docker 支持以 detached（-d）、交互（-it）或多种参数组合的方式运行容器。使用 --rm 可以在容器退出后自动删除它。"
          - type: "tip"
            title: "资源限制"
            content: "在生产环境中，建议使用 --memory=512m 和 --cpus=0.5 之类的参数限制每个容器可用的资源，避免单个容器影响宿主机的稳定性。"
          - type: "info"
            title: "数据持久化"
            content: "容器天生是临时的。容器被删除后，其中创建的数据也会丢失，除非使用卷（volume）或 bind mount 进行持久化。"
        validation:
          - command: "docker ps -a --format '{{.Names}}' | grep -w meu-nginx || echo ''"
            expectedOutput: "meu-nginx"
            errorMessage: "容器 meu-nginx 未创建。请检查 docker run 命令是否正确执行。"
          - command: "curl -s localhost:8080 | grep -q -i nginx && echo 'Nginx acessível' || echo 'Erro no acesso'"
            expectedOutput: "Nginx acessível"
            errorMessage: "无法访问 8080 端口上的 Nginx。请检查容器是否在运行、端口映射是否正确。"

      - name: "使用 Docker 镜像"
        description: "学习搜索、下载和管理 Docker 镜像，理解标签（tag）、版本和 registry 等概念。"
        steps:
          - "**Docker 镜像**是构建容器的基石。它由多个只读层组成，这些层叠加在一起构成容器的文件系统。"
          - "**1. 在 Docker Hub 中搜索镜像**"
          - "Docker Hub 是默认的公共 registry，上面有数千个官方和社区镜像："
          - "`docker search ubuntu`"
          - "该命令在 Docker Hub 中搜索与 'ubuntu' 相关的镜像。输出显示名称、描述、星数（流行度）、是否官方以及是否自动构建。"
          - "更精确的搜索："
          - "`docker search --filter=stars=1000 nginx`"
          - "这样只显示星数至少 1000 的 Nginx 镜像。"
          - "**2. 下载镜像（pull）**"
          - "我们可以只下载镜像而不立即创建容器："
          - "`docker pull alpine`"
          - "默认下载 'latest' 标签。标签用于给镜像定版本。要下载特定版本："
          - "`docker pull ubuntu:20.04`"
          - "这里 '20.04' 就是标签，指定了我们想要的 Ubuntu 版本。"
          - "Docker 使用分层系统来优化镜像的存储和传输。如果本地已有镜像的部分层，就只会下载新的层。"
          - "**3. 列出和管理本地镜像**"
          - "查看所有已下载的镜像："
          - "`docker images`"
          - "或查看更多细节："
          - "`docker images --digests`"
          - "digest 是一个 SHA256 哈希，唯一标识镜像的内容，与标签无关。"
          - "删除一个不再使用的镜像："
          - "`docker rmi alpine`"
          - "如果镜像正被某个容器使用（即使是已停止的容器），需要先删除容器，或强制删除镜像："
          - "`docker rmi -f alpine`"
          - "**4. 理解标签系统**"
          - "标签是管理镜像版本的关键。一些常见约定："
          - "- `latest` - 通常指向最新版本，但并不保证"
          - "- 语义化版本 - `3.9.6`、`2.0` 等"
          - "- 基础发行版 - `alpine`、`slim`、`stretch`"
          - "- 组合形式 - `3.9.6-alpine`、`latest-slim`"
          - "例如，我们看看 Node.js 的可用标签："
          - "`docker pull node:lts-alpine`"
          - "该命令下载 Node.js 的 LTS（长期支持）版本，基于 Alpine Linux 镜像，比默认镜像小得多。"
          - "**5. 检查镜像**"
          - "查看镜像的详细信息，包括层、卷、端口等元数据："
          - "`docker inspect node:lts-alpine`"
          - "查看镜像的层历史，了解它是如何构建的："
          - "`docker history node:lts-alpine`"
          - "该命令显示创建镜像的每一条指令，帮助你理解其内部结构。"
        tips:
          - type: "info"
            title: "官方镜像 vs 社区镜像"
            content: "Docker Hub 上的官方镜像（标记为 [OK]）由 Docker Inc. 或其合作伙伴维护，通常遵循安全最佳实践。生产环境建议使用官方镜像或自行构建。"
          - type: "warning"
            title: "'latest' 标签的陷阱"
            content: "避免在生产环境中使用 'latest' 标签，因为它可能随时变化。使用具体版本标签可以保证可复现性，避免升级时出现意外。"
          - type: "tip"
            title: "优化的基础镜像"
            content: "Alpine 变体比默认基础镜像小得多。例如 'node:alpine' 约 50MB，而 'node'（基于 Debian）超过 300MB。镜像越小下载越快，且安装的包更少、更安全。"
        validation:
          - command: "docker images alpine --format 'found' 2>/dev/null || echo 'not found'"
            expectedOutput: "found"
            errorMessage: "Alpine 镜像未下载。请执行 'docker pull alpine' 下载。"
          - command: "docker images | wc -l"
            expectedExpression: ">= 2"
            errorMessage: "除了表头之外，你应该至少有一个镜像。请执行几条 docker pull 命令。"
