apiVersion: v1
kind: ConfigMap
metadata:
  name: linux-comandos-basicos-zh-lab
  namespace: girus
  labels:
    app: girus-lab-template
data:
  lab.yaml: |
    name: linux-comandos-basicos-zh
    title: "Linux 基础：目录导航与核心命令（中文版）"
    description: "掌握在命令行环境中高效工作所需的 Linux 基础命令与核心概念。本引导式实验涵盖文件系统导航、文件操作与进程管理，为 Linux 系统管理和日常运维打下坚实基础。"
    duration: 25m
    image: "girus-devops-zh:0.1"
    tasks:
      - name: "文件系统导航"
        description: "理解 Linux 目录结构，学会使用核心命令在系统中高效导航。"
        steps:
          - "**理解 Linux 文件系统**"
          - "Linux 将所有文件组织在单一的层级结构中，从根目录 `/` 开始。与 Windows 使用多个独立盘符（C:, D:）不同，Linux 中一切都是同一棵目录树的一部分。"
          - "一些重要的目录包括："
          - "- `/home`：存放各用户的家目录"
          - "- `/etc`：存放系统配置文件"
          - "- `/var`：存放可变数据，如日志和队列"
          - "- `/bin` 与 `/usr/bin`：存放可执行程序（二进制文件）"
          - "- `/tmp`：临时文件，通常在重启时被清空"
          - "**确认当前位置**"
          - "高效导航的第一步是知道自己当前在哪里。为此我们使用 `pwd`（Print Working Directory）命令："
          - "`pwd`"
          - "该命令显示从根目录 `/` 出发的当前目录完整路径。"
          - "**列出目录内容**"
          - "要查看当前目录的内容，使用 `ls`（list）命令。默认只显示非隐藏文件的简单列表："
          - "`ls`"
          - "要获得更详细的信息并查看隐藏文件（以 `.` 开头的文件），需要附加参数："
          - "`ls -la`"
          - "其中："
          - "- `-l` 启用长格式，显示权限、所有者、大小、修改时间等"
          - "- `-a` 显示所有文件，包括隐藏文件"
          - "**`ls -l` 输出各列的含义：**"
          - "1. 文件类型与权限（如 `-rw-r--r--`）"
          - "2. 链接数"
          - "3. 文件所有者"
          - "4. 文件所属组"
          - "5. 大小（字节）"
          - "6. 最后修改时间"
          - "7. 文件名"
          - "**创建目录与切换目录**"
          - "创建新目录使用 `mkdir`（make directory）命令："
          - "`mkdir lab-practice`"
          - "切换到该目录使用 `cd`（change directory）命令："
          - "`cd lab-practice`"
          - "确认你已在新目录中："
          - "`pwd`"
          - "**创建空文件**"
          - "`touch` 命令可以简单地创建空文件，或更新已有文件的修改时间："
          - "`touch file1.txt file2.txt file3.txt`"
          - "验证文件已创建："
          - "`ls -l`"
          - "你会看到这些文件的大小都是零。"
          - "**导航进阶技巧**"
          - "几个实用的导航快捷方式："
          - "- `cd ..`：移动到上级目录（上一层）"
          - "- `cd ~` 或直接 `cd`：移动到当前用户的家目录（home）"
          - "- `cd -`：返回上一个目录（最后一次 cd 之前所在的位置）"
          - "- `cd /`：移动到系统根目录"
          - "试着返回上一层，再回到练习目录："
          - "`cd ..`"
          - "`pwd`"
          - "`cd lab-practice`"
        tips:
          - type: "info"
            title: "技巧：Tab 键补全"
            content: "Tab 键对自动补全文件名和目录名极为有用。如果只有一个候选，按一次 Tab 自动补全；按两次 Tab 可列出所有可能的候选。"
          - type: "tip"
            title: "快速导航"
            content: "可以一次组合多级路径进行快速导航：`cd ../../outro-dir` 会向上移动两层，然后进入 'outro-dir' 目录。"
          - type: "warning"
            title: "绝对路径 vs 相对路径"
            content: "以 / 开头的路径是绝对路径（从根目录出发），其他路径都是相对于当前目录的相对路径。使用相对路径通常能让你的命令更具可移植性。"
        validation:
          - command: "test -d lab-practice && echo 'ok'"
            expectedOutput: "ok"
            errorMessage: "目录 'lab-practice' 未正确创建。"
          - command: "test -f lab-practice/file1.txt && test -f lab-practice/file2.txt && test -f lab-practice/file3.txt && echo 'ok'"
            expectedOutput: "ok"
            errorMessage: "三个测试文件未正确创建。"

      - name: "文件操作与内容处理"
        description: "学习在 Linux 中创建、编辑、复制和操作文件，理解重定向概念与文本处理命令。"
        steps:
          - "**Linux 中的文本编辑器**"
          - "Linux 提供多种文本编辑器来创建和修改文件，最常见的有："
          - "- **vim/vi**：功能强大，但学习曲线较陡"
          - "- **nano**：更简单，对新手友好"
          - "- **emacs**：可扩展、高度可定制的编辑器"
          - "本实验使用 Vim，因为它无处不在——几乎存在于所有 Linux 系统中。"
          - "**用 Vim 创建和编辑文件**"
          - "Vim 在不同的'模式'下工作，主要有：普通模式（导航）、插入模式（编辑）和命令模式（执行命令）。"
          - "我们用 Vim 创建一个文本文件："
          - "`vim notes.txt`"
          - "默认情况下 Vim 启动在普通模式。要输入文本，按 `i` 进入插入模式，然后输入以下内容："
          - "```"
          - "我的 Linux 学习笔记："
          - "1. Linux 是一个基于 Unix 的操作系统"
          - "2. 它由 Linus Torvalds 于 1991 年创建"
          - "3. Linux 的吉祥物是一只名叫 Tux 的企鹅"
          - "```"
          - "输入完成后，按 `Esc` 键回到普通模式。保存并退出："
          - "1. 输入 `:` 进入命令模式"
          - "2. 输入 `wq`（write and quit）并按回车"
          - "**Vim 基本工作流：**"
          - "- `i`：进入插入模式（光标前）"
          - "- `a`：进入插入模式（光标后）"
          - "- `Esc`：回到普通模式"
          - "- `:w`：保存（write）"
          - "- `:q`：退出（quit）"
          - "- `:wq` 或 `ZZ`：保存并退出"
          - "- `:q!`：不保存强制退出"
          - "**查看文件内容**"
          - "不进入编辑器而直接查看文件内容，有几种方式："
          - "`cat notes.txt`"
          - "`cat` 命令一次性显示整个文件内容。对较大的文件，更适合使用："
          - "`less notes.txt`"
          - "`less` 支持用方向键、Page Up/Down 等浏览文件，按 `q` 退出。"
          - "只看文件开头或结尾的几行："
          - "`head -n 2 notes.txt`  # 显示前 2 行"
          - "`tail -n 2 notes.txt`  # 显示最后 2 行"
          - "**复制、移动与重命名文件**"
          - "复制文件："
          - "`cp notes.txt notes-backup.txt`"
          - "移动或重命名（在 Linux 中是同一个操作）："
          - "`mv notes-backup.txt backup-1.txt`"
          - "`ls -l`  # 注意 notes-backup.txt 现在变成了 backup-1.txt"
          - "恢复原来的文件名："
          - "`mv backup-1.txt notes-backup.txt`"
          - "**比较文件**"
          - "`diff` 命令可以查看两个文件之间的差异："
          - "`diff notes.txt notes-backup.txt`"
          - "目前应该没有差异。我们来修改原文件："
          - "`echo 'Nova linha adicionada!' >> notes.txt`"
          - "操作符 `>>` 把 `echo` 命令的输出追加到文件末尾，而不覆盖已有内容。"
          - "再次比较："
          - "`diff notes.txt notes-backup.txt`"
          - "你会看到差异：原文件中多出的那一行。"
          - "**重定向与管道**"
          - "Linux 允许把命令的输出重定向到文件或其他命令："
          - "- `>`：重定向并覆盖文件"
          - "- `>>`：重定向并追加到文件"
          - "- `|`：管道（pipe）——把一个命令的输出作为另一个命令的输入"
          - "示例："
          - "`echo 'Conteúdo novo' > new-file.txt`  # 创建或覆盖"
          - "`echo 'Mais uma linha' >> new-file.txt`  # 追加"
          - "`cat notes.txt | grep Linux`  # 过滤包含 'Linux' 的行"
        tips:
          - type: "warning"
            title: "注意：重定向操作符"
            content: "> 符号会完全覆盖已存在的文件，小心不要丢失重要数据。要在末尾追加而保留原有内容，请使用 >>。"
          - type: "tip"
            title: "替代编辑器"
            content: "如果还不习惯 Vim，可以试试更直观的 nano 编辑器：`nano notes.txt`。nano 的命令显示在屏幕底部，Ctrl+O 保存，Ctrl+X 退出。"
          - type: "info"
            title: "退出 Vim"
            content: "如果被困在 Vim 里不知道怎么退出，先按 Esc（确保处于普通模式），然后输入 :q! 并回车，即可不保存更改直接退出。"
        validation:
          - command: "test -f lab-practice/notes.txt && echo 'ok'"
            expectedOutput: "ok"
            errorMessage: "文件 notes.txt 未正确创建。"
          - command: "test -f lab-practice/notes-backup.txt && echo 'ok'"
            expectedOutput: "ok"
            errorMessage: "备份文件未正确创建。"
          - command: "grep -q 'Nova linha adicionada!' lab-practice/notes.txt && echo 'ok'"
            expectedOutput: "ok"
            errorMessage: "新的一行未成功追加到 notes.txt。"

      - name: "进程管理"
        description: "理解 Linux 如何管理进程，学会通过命令行监控、控制和管理正在运行的应用程序。"
        steps:
          - "**Linux 进程核心概念**"
          - "在 Linux 中，每个运行中的程序由一个或多个进程表示。进程本质上是运行中的程序实例，拥有自己的内存空间、资源和唯一标识符（PID - Process ID）。"
          - "进程可以处于不同的状态："
          - "- **Running**：正在运行或等待被调度运行"
          - "- **Sleeping**：等待某个事件或资源"
          - "- **Stopped**：被暂停，通常是收到了某个信号"
          - "- **Zombie**：进程已结束，但仍在进程表中保留条目"
          - "**列出进程**"
          - "最基本的列进程命令是 `ps`（process status）："
          - "`ps`"
          - "默认情况下 `ps` 只显示与当前终端关联的进程。要查看系统所有进程，需要附加参数："
          - "`ps aux`"
          - "其中："
          - "- `a`：显示所有用户的进程"
          - "- `u`：面向用户的输出格式，包含 %CPU、%MEM 等列"
          - "- `x`：包括没有控制终端的进程"
          - "输出中包含一些重要的列："
          - "- **USER**：进程所有者"
          - "- **PID**：进程 ID"
          - "- **%CPU/%MEM**：占用的 CPU 和内存百分比"
          - "- **STAT**：进程状态（R=running，S=sleeping，Z=zombie 等）"
          - "- **COMMAND**：启动该进程的命令"
          - "**实时监控**"
          - "要实时监控进程，可以使用 `top` 或 `htop` 这类工具："
          - "`htop`"
          - "`htop` 是 `top` 的增强版，界面彩色且可交互。它能显示："
          - "- CPU 和内存使用率图表"
          - "- 可排序的进程列表（F6）"
          - "- 过滤（F4）与搜索"
          - "- 向进程发送信号（F9）"
          - "用方向键浏览，按 `q` 退出。"
          - "**后台运行进程**"
          - "在 Linux 中，可以使用操作符 `&` 轻松地把进程放到后台（background）运行："
          - "`sleep 300 &`"
          - "这个命令启动一个'睡眠'300 秒（5 分钟）的进程，由于在后台运行，终端立即被释放出来供你继续执行其他命令。"
          - "系统会显示该后台进程的 PID，类似 `[1] 12345`。"
          - "**查看后台进程**"
          - "查看当前终端中正在后台运行的任务（jobs）："
          - "`jobs`"
          - "要按名称查找特定进程，可以用 `grep` 配合 `ps`："
          - "`ps aux | grep sleep`"
          - "注意这条命令的输出里也会包含 `grep` 进程本身。"
          - "**控制进程**"
          - "Linux 提供多个控制进程的命令："
          - "- `kill [PID]`：发送信号（默认 SIGTERM）请求进程优雅退出"
          - "- `kill -9 [PID]` 或 `kill -KILL [PID]`：强制立即终止（谨慎使用）"
          - "- `killall [名称]`：终止所有指定名称的进程"
          - "- `pkill [模式]`：终止匹配某个模式的进程"
          - "我们来终止刚才启动的 `sleep` 进程："
          - "`pkill sleep`"
          - "验证进程已被终止："
          - "`ps aux | grep sleep`"
          - "现在输出中应该只剩下 `grep` 进程本身。"
          - "**进程优先级**"
          - "Linux 中每个进程都有一个优先级（'nice' 值），范围从 -20（最高优先级）到 19（最低优先级）。可以以指定优先级启动进程："
          - "`nice -n 10 sleep 60 &`"
          - "或者修改运行中进程的优先级（提高优先级需要更高权限）："
          - "`renice +5 [PID]`"
        tips:
          - type: "tip"
            title: "top 的替代品"
            content: "htop 是 top 的增强版，界面彩色且可交互。如果没安装，在 Debian/Ubuntu 系统上可以用 'sudo apt install htop' 安装。"
          - type: "info"
            title: "僵尸进程"
            content: "僵尸进程（Z 状态）是已经结束但退出状态尚未被父进程收集的进程。通常无害，除非大量出现。"
          - type: "warning"
            title: "kill -9 的风险"
            content: "SIGKILL（kill -9）会强制立即终止进程，不给它清理资源的机会。只在其他信号无效时使用，否则可能造成数据丢失或资源未释放。"
        validation:
          - command: "ps aux | grep -v grep | grep -q sleep || echo 'ok'"
            expectedOutput: "ok"
            errorMessage: "sleep 进程未被正确终止。"
          - command: "command -v htop &>/dev/null || echo 'instale htop'; echo 'ok'"
            expectedOutput: "ok"
            errorMessage: "htop 命令不可用。"

      - name: "基础权限管理"
        description: "理解 Linux 权限系统，学会以安全、高效的方式控制对文件和目录的访问。"
        steps:
          - "**Linux 权限系统**"
          - "Linux 实现了一套基于用户和组的权限系统，控制谁能访问文件和目录、能对它们做什么。"
          - "Linux 中每个文件和目录都有三个权限级别："
          - "- **所有者（u）**：拥有该文件的用户"
          - "- **组（g）**：与该文件关联的组"
          - "- **其他人（o）**：其余所有用户"
          - "**权限类型**"
          - "每个级别可以有三种权限："
          - "- **r（read）**：允许读取内容"
          - "- **w（write）**：允许修改内容"
          - "- **x（execute）**：允许执行（对文件）或进入（对目录）"
          - "**查看权限**"
          - "使用 `ls -l` 时，输出第一个字段就是权限："
          - "`ls -l`"
          - "格式为：`rwxrwxrwx`"
          - "- 前 3 个字符：所有者权限"
          - "- 中间 3 个字符：组权限"
          - "- 最后 3 个字符：其他人权限"
          - "`-` 表示该权限不存在。"
          - "**修改权限**"
          - "`chmod`（change mode）命令用于修改权限，有两种主要写法："
          - "**符号记法**：使用字母和符号"
          - "创建一个测试文件："
          - "`echo 'Arquivo de teste para permissoes' > perm_test.txt`"
          - "查看当前权限："
          - "`ls -l perm_test.txt`"
          - "给所有者添加执行权限："
          - "`chmod u+x perm_test.txt`"
          - "移除其他人的读权限："
          - "`chmod o-r perm_test.txt`"
          - "给所有人设置读写权限："
          - "`chmod a=rw perm_test.txt`"
          - "**八进制记法**：使用数字（更简洁）"
          - "每种权限对应一个数值："
          - "- r = 4"
          - "- w = 2"
          - "- x = 1"
          - "每个级别的权限就是对应数值之和："
          - "`chmod 644 perm_test.txt`  # rw-r--r--"
          - "`chmod 755 perm_test.txt`  # rwxr-xr-x"
          - "`chmod 600 perm_test.txt`  # rw-------"
          - "**修改所有者和组**"
          - "`chown`（change owner）命令修改所有者和/或组："
          - "`sudo chown root perm_test.txt`  # 只改所有者"
          - "`sudo chown root:root perm_test.txt`  # 同时改所有者和组"
          - "`chgrp` 命令只改组："
          - "`sudo chgrp root perm_test.txt`"
          - "**目录的特殊权限含义**"
          - "对目录而言，权限的含义略有不同："
          - "- **r**：允许列出目录内容"
          - "- **w**：允许在目录内创建、重命名或删除文件"
          - "- **x**：允许进入该目录"
          - "创建一个测试目录："
          - "`mkdir test_dir`"
          - "递归地设置权限（对目录及其内容）："
          - "`chmod -R 750 test_dir`  # rwxr-x---"
        tips:
          - type: "info"
            title: "目录权限"
            content: "目录的执行权限（x）至关重要：没有它，即使你对目录内的文件有权限，也无法访问这些文件。"
          - type: "warning"
            title: "安全性"
            content: "避免给文件和目录过于宽松的权限（如 777）。这是安全隐患，在多用户环境或服务器上尤其危险。"
          - type: "tip"
            title: "权限与 sudo"
            content: "像 chown 这样的命令通常需要超级用户权限（sudo）。如果遇到权限报错，检查是否在需要时使用了 sudo。"
        validation:
          - command: "test -f lab-practice/perm_test.txt && echo 'ok'"
            expectedOutput: "ok"
            errorMessage: "文件 perm_test.txt 未正确创建。"
          - command: "test -d lab-practice/test_dir && echo 'ok'"
            expectedOutput: "ok"
            errorMessage: "目录 test_dir 未正确创建。"
